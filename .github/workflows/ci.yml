name: Checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --locked --python 3.11
      - run: uv run pytest -q
  release-build:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag rabbithole:ci .
      - run: docker run --detach --name rabbithole-ci --publish 127.0.0.1:8000:8000 rabbithole:ci
      - run: python3 scripts/smoke.py --wait 30
      - run: python3 scripts/load_check.py
      - if: failure()
        run: docker logs rabbithole-ci || true
