name: Bug report
description: Report a problem using RabbitHole.
body:
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: Include the route or topic and the steps that led to the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: For example, Safari on macOS.
